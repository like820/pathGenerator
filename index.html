<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pathgenerator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  <script src="https://unpkg.com/p5.js-svg@1.3.1"></script>

  <style>
    :root {
      --bg: #e8e4db;
      --black: #111;
      --red: #ff3333;
      --yellow: #ffea00;
      --blue: #3333ff;
      --white: #ffffff;
      --green: #00e676;
    }
    
    * {
      box-sizing: border-box;
      text-transform: lowercase; /* strict lowercase */
      font-family: 'Source Sans 3', sans-serif;
    }

    /* CRITICAL FIX: Allow scrolling on the body, but prevent text selection globally */
    body {
      background-color: var(--bg);
      color: var(--black);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
      
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* ONLY apply touch-action: none to the actual canvases so drawing doesn't scroll the page */
    #canvas-container canvas, #mini-canvas {
      touch-action: none;
    }

    #ui-panel {
      width: 100%;
      max-width: 320px;
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0px var(--black);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      margin: 0;
      border-bottom: 4px dashed var(--black);
      padding-bottom: 5px;
      line-height: 1;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label.header {
      font-weight: 900;
      font-size: 15px;
      background: var(--black);
      color: var(--white);
      padding: 4px 8px;
      align-self: flex-start;
      transform: rotate(-1deg);
      margin-bottom: 2px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .pool-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .color-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .pool-item {
      position: relative;
    }

    .pool-item input[type="checkbox"] {
      opacity: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 2;
      margin: 0;
    }

    .pool-item label {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px 2px;
      font-size: 12px;
      font-weight: 700;
      border: 3px solid var(--black);
      background: var(--white);
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
      box-shadow: 3px 3px 0px var(--black);
      height: 100%;
      min-height: 32px;
    }

    .pool-item input[type="checkbox"]:checked + label {
      background: var(--black);
      color: var(--white);
      transform: translate(3px, 3px);
      box-shadow: 0px 0px 0px var(--black);
    }

    .color-grid .pool-item label { font-size: 0; height: 32px; }
    
    .color-grid .pool-item input[type="checkbox"]:checked + label {
      border: 4px solid var(--white);
      outline: 3px solid var(--black);
    }

    .custom-color-btn { grid-column: span 2; }
    .custom-color-btn label {
      font-size: 12px !important;
      color: var(--black) !important;
      background: var(--white) !important;
      border: 3px dashed var(--black) !important;
    }

    button, input[type="range"] {
      font-size: 15px;
      font-weight: 800;
      border: 4px solid var(--black);
      background: var(--white);
      padding: 8px;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--black);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    input[type="range"] {
      -webkit-appearance: none;
      padding: 0;
      height: 20px;
      background: var(--black);
      box-shadow: 3px 3px 0px var(--black);
      flex-grow: 1;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 20px;
      background: var(--white);
      border: 2px solid var(--black);
      cursor: ew-resize;
    }

    button:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--black);
    }
    button:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px var(--black);
    }

    #btn-export { background: var(--red); color: var(--white); }
    #btn-clear { background: var(--yellow); }
    #btn-save-custom { background: var(--black); color: var(--white); font-size: 13px; padding: 6px; }

    .drawer-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #mini-canvas {
      border: 3px solid var(--black);
      background: var(--bg);
      cursor: crosshair;
      width: 100px;
      height: 100px;
      flex-shrink: 0;
    }

    #canvas-container {
      border: 4px solid var(--black);
      box-shadow: 8px 8px 0px var(--black);
      background: var(--white);
      width: fit-content;
      height: fit-content;
      max-width: 100%;
      overflow-x: auto;
    }

    .toggles-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
      margin-top: 5px;
    }
    .toggle-lbl {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #ui-panel { max-width: 100%; }
    }
  </style>
</head>
<body>

  <div id="ui-panel">
    <h1>pathgenerator</h1>
    
    <div class="control-group">
      <label class="header" style="transform: rotate(1deg)">grid size</label>
      <div class="slider-row">
        <span>size: <span id="grid-val">12</span></span>
        <input type="range" id="grid-select" min="6" max="20" value="12">
      </div>
    </div>

    <div class="control-group">
      <label class="header">shapes pool</label>
      <div class="pool-grid" id="shape-pool"></div>
    </div>

    <div class="control-group">
      <label class="header" style="transform: rotate(1.5deg)">draw custom</label>
      <div class="drawer-container">
        <canvas id="mini-canvas" width="100" height="100"></canvas>
        <button id="btn-save-custom">add shape</button>
      </div>
    </div>

    <div class="control-group">
      <label class="header">colors pool</label>
      <div class="pool-grid color-grid" id="color-pool">
        <div class="pool-item custom-color-btn" id="add-color-btn">
          <label for="hidden-color-picker">+ custom</label>
          <input type="color" id="hidden-color-picker" style="opacity:0; position:absolute; inset:0; width:100%; height:100%; cursor:pointer;">
        </div>
      </div>
    </div>

    <div class="control-group">
      <label class="header" style="transform: rotate(0deg)">stroke width</label>
      <div class="slider-row">
        <span>min: <span id="min-weight-val">4</span>px</span>
        <input type="range" id="min-weight-select" min="1" max="15" value="4">
      </div>
      <div class="slider-row">
        <span>max: <span id="max-weight-val">8</span>px</span>
        <input type="range" id="max-weight-select" min="1" max="15" value="8">
      </div>
    </div>

    <div class="toggles-row">
      <label class="toggle-lbl"><input type="checkbox" id="show-grid"> show grid</label>
      <label class="toggle-lbl"><input type="checkbox" id="anim-toggle"> animate strokes</label>
    </div>

    <div style="font-size: 13px; font-weight: 700; border: 3px solid var(--black); padding: 8px; transform: rotate(0.5deg);">
      * touch/drag on grid to spawn. outside canvas to scroll.
    </div>

    <button id="btn-export">export svg</button>
    <button id="btn-clear">clear grid</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    const BUILT_IN_SHAPES = [
      "line", "sine", "square", "saw", "dots", "scribble", 
      "water", "dither", "crazy", "dash", "coil", "ecg", "bounce"
    ];
    const DEFAULT_SHAPES = ["line", "sine", "square"];
    
    const INITIAL_COLORS = [
      { hex: "#3333ff", checked: true }, 
      { hex: "#ffea00", checked: true }, 
      { hex: "#ff3333", checked: true }, 
      { hex: "#111111", checked: true }
    ];
    
    let customShapesData = {}; 
    let customShapeCount = 0;
    
    let gridSize = 12;
    let cellSize = 40;
    
    let grid = [];
    let allPaths = []; // Store fully computed paths here
    let forceRedraw = true; 

    const shapePoolContainer = document.getElementById('shape-pool');
    function addShapeToPool(shapeName, isChecked = false) {
      let id = `shape-${shapeName.replace(/\s+/g, '-')}`;
      let checkedStr = isChecked ? 'checked' : '';
      let div = document.createElement('div');
      div.className = 'pool-item';
      div.innerHTML = `<input type="checkbox" id="${id}" value="${shapeName}" ${checkedStr}><label for="${id}">${shapeName}</label>`;
      shapePoolContainer.appendChild(div);
      div.querySelector('input').addEventListener('change', () => forceRedraw = true);
    }
    BUILT_IN_SHAPES.forEach(shape => addShapeToPool(shape, DEFAULT_SHAPES.includes(shape)));

    const colorPoolContainer = document.getElementById('color-pool');
    const addColorBtn = document.getElementById('add-color-btn');

    function addColorToPool(hex, isChecked = true) {
      let cleanHex = hex.toLowerCase();
      let id = `col-${cleanHex.replace('#', '')}`;
      if (document.getElementById(id)) return; 
      
      let checkedStr = isChecked ? 'checked' : '';
      let div = document.createElement('div');
      div.className = 'pool-item';
      div.innerHTML = `<input type="checkbox" id="${id}" value="${cleanHex}" ${checkedStr}><label for="${id}" style="background-color: ${cleanHex};"></label>`;
      colorPoolContainer.insertBefore(div, addColorBtn);
      div.querySelector('input').addEventListener('change', () => forceRedraw = true);
      forceRedraw = true;
    }
    INITIAL_COLORS.forEach(c => addColorToPool(c.hex, c.checked));
    document.getElementById('hidden-color-picker').addEventListener('change', (e) => addColorToPool(e.target.value, true));

    document.getElementById('min-weight-select').addEventListener('input', (e) => {
      document.getElementById('min-weight-val').innerText = e.target.value;
      if (parseInt(e.target.value) > parseInt(document.getElementById('max-weight-select').value)) {
        document.getElementById('max-weight-select').value = e.target.value;
        document.getElementById('max-weight-val').innerText = e.target.value;
      }
      forceRedraw = true;
    });
    
    document.getElementById('max-weight-select').addEventListener('input', (e) => {
      document.getElementById('max-weight-val').innerText = e.target.value;
      if (parseInt(e.target.value) < parseInt(document.getElementById('min-weight-select').value)) {
        document.getElementById('min-weight-select').value = e.target.value;
        document.getElementById('min-weight-val').innerText = e.target.value;
      }
      forceRedraw = true;
    });
    
    document.getElementById('grid-select').addEventListener('input', (e) => {
      document.getElementById('grid-val').innerText = e.target.value;
    });
    document.getElementById('grid-select').addEventListener('change', rebuildGrid);
    document.getElementById('show-grid').addEventListener('change', () => forceRedraw = true);
    document.getElementById('anim-toggle').addEventListener('change', () => forceRedraw = true);

    const miniCanvas = document.getElementById('mini-canvas');
    const miniCtx = miniCanvas.getContext('2d');
    let isDrawingMini = false;
    let miniPoints = [];

    function clearMiniCanvas() {
      miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
      miniCtx.beginPath();
      miniCtx.moveTo(0, miniCanvas.height/2);
      miniCtx.lineTo(miniCanvas.width, miniCanvas.height/2);
      miniCtx.strokeStyle = '#ddd';
      miniCtx.lineWidth = 1;
      miniCtx.setLineDash([4, 4]);
      miniCtx.stroke();
      miniCtx.setLineDash([]);
      miniPoints = [];
    }
    clearMiniCanvas();

    function getPointerPos(e) {
      const rect = miniCanvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    miniCanvas.addEventListener('pointerdown', (e) => {
      isDrawingMini = true;
      clearMiniCanvas();
      const pos = getPointerPos(e);
      miniPoints.push(pos);
      miniCtx.beginPath();
      miniCtx.moveTo(pos.x, pos.y);
      miniCtx.strokeStyle = '#111';
      miniCtx.lineWidth = 3;
      miniCtx.lineCap = 'round';
      miniCtx.lineJoin = 'round';
    });

    miniCanvas.addEventListener('pointermove', (e) => {
      if (!isDrawingMini) return;
      const pos = getPointerPos(e);
      miniPoints.push(pos);
      miniCtx.lineTo(pos.x, pos.y);
      miniCtx.stroke();
    });

    const stopDrawingMini = () => { isDrawingMini = false; };
    miniCanvas.addEventListener('pointerup', stopDrawingMini);
    miniCanvas.addEventListener('pointerleave', stopDrawingMini);

    document.getElementById('btn-save-custom').addEventListener('click', () => {
      if (miniPoints.length < 2) return; 
      let minX = Math.min(...miniPoints.map(p => p.x));
      let maxX = Math.max(...miniPoints.map(p => p.x));
      let strokeW = Math.max(maxX - minX, 1); 
      
      let normalized = miniPoints.map(p => {
        return { nx: (p.x - minX) / strokeW, ny: (p.y - miniCanvas.height/2) / (miniCanvas.height/2) };
      });
      customShapeCount++;
      let shapeName = `custom ${customShapeCount}`;
      customShapesData[shapeName] = normalized;
      addShapeToPool(shapeName, true);
      clearMiniCanvas();
      
      let btn = document.getElementById('btn-save-custom');
      btn.innerText = "saved!";
      setTimeout(() => btn.innerText = "add shape", 1000);
    });

    function setup() {
      let p5c = createCanvas(gridSize * cellSize, gridSize * cellSize, SVG);
      p5c.parent('canvas-container');
      frameRate(30); 
      initGridData();
      document.getElementById('btn-export').addEventListener('click', () => save("path_generator.svg"));
      document.getElementById('btn-clear').addEventListener('click', rebuildGrid);
    }

    function rebuildGrid() {
      gridSize = parseInt(document.getElementById('grid-select').value);
      resizeCanvas(gridSize * cellSize, gridSize * cellSize);
      initGridData();
    }

    function initGridData() {
      grid = [];
      allPaths = [];
      for (let i = 0; i < gridSize; i++) {
        grid[i] = [];
        for (let j = 0; j < gridSize; j++) grid[i][j] = false;
      }
      forceRedraw = true;
    }

    class PathObj {
      constructor(startCell, shapeType, col, weight) {
        this.nodes = [startCell];
        this.shape = shapeType;
        this.color = col;
        this.weight = weight;
        this.animProgress = 0;
        this.generateFullWalk();
      }
      
      generateFullWalk() {
        let currentCell = this.nodes[0];
        let directions = [{x: 1, y: 0}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 0, y: -1}];
        
        while(true) {
          let neighbors = [];
          for (let dir of directions) {
            let nx = currentCell.x + dir.x;
            let ny = currentCell.y + dir.y;
            if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize && !grid[nx][ny]) {
              neighbors.push({x: nx, y: ny});
            }
          }
          if (neighbors.length > 0) {
            let nextCell = neighbors[floor(random(neighbors.length))];
            this.nodes.push(nextCell);
            grid[nextCell.x][nextCell.y] = true;
            currentCell = nextCell;
          } else {
            break; 
          }
        }
      }
    }

    function attemptSpawn(mx, my) {
      let i = floor(mx / cellSize);
      let j = floor(my / cellSize);
      
      if (i >= 0 && i < gridSize && j >= 0 && j < gridSize && !grid[i][j]) {
        let availableShapes = [];
        document.querySelectorAll('#shape-pool input[type="checkbox"]:checked').forEach(cb => availableShapes.push(cb.value));
        if (availableShapes.length === 0) availableShapes = ["line"];
        
        let availableColors = [];
        document.querySelectorAll('#color-pool input[type="checkbox"]:checked').forEach(cb => {
          if (cb.id !== 'hidden-color-picker') availableColors.push(cb.value);
        });
        if (availableColors.length === 0) availableColors = ["#111111"];

        let minW = parseInt(document.getElementById('min-weight-select').value);
        let maxW = parseInt(document.getElementById('max-weight-select').value);
        
        let chosenShape = random(availableShapes);
        let chosenColor = random(availableColors);
        let randomWeight = floor(random(minW, maxW + 1));

        let p = new PathObj({x: i, y: j}, chosenShape, chosenColor, randomWeight);
        grid[i][j] = true; 
        allPaths.push(p);
        forceRedraw = true;
      }
    }

    function mousePressed() { attemptSpawn(mouseX, mouseY); }
    function mouseDragged() { attemptSpawn(mouseX, mouseY); }

    function draw() {
      let isAnimated = document.getElementById('anim-toggle').checked;
      
      let animationActive = false;
      for (let p of allPaths) {
        let targetLen = p.nodes.length - 1;
        if (isAnimated) {
          if (p.animProgress < targetLen) {
            p.animProgress = Math.min(p.animProgress + 0.25, targetLen); 
            animationActive = true;
            forceRedraw = true;
          }
        } else {
          if (p.animProgress < targetLen) {
            p.animProgress = targetLen; 
            forceRedraw = true;
          }
        }
      }

      if (forceRedraw || animationActive) {
        clear();
        if (document.getElementById('show-grid').checked) drawGridLines();

        for (let p of allPaths) {
          renderPath(p);
        }
        
        if (!animationActive) forceRedraw = false;
      }
    }

    function drawGridLines() {
      strokeWeight(1);
      stroke(220);
      for (let i = 0; i <= gridSize; i++) line(i * cellSize, 0, i * cellSize, height);
      for (let j = 0; j <= gridSize; j++) line(0, j * cellSize, width, j * cellSize);
      fill(180); noStroke();
      for (let i = 0; i <= gridSize; i++) {
        for (let j = 0; j <= gridSize; j++) circle(i * cellSize, j * cellSize, 4);
      }
    }

    function renderPath(pathObj) {
      let pts = pathObj.nodes;
      if (pts.length < 2) return;

      let limit = pathObj.animProgress;
      
      for (let i = 0; i < pts.length - 1; i++) {
        if (i < Math.floor(limit)) {
          drawSegment(pts[i], pts[i+1], pathObj, 1.0);
        } else if (i === Math.floor(limit)) {
          let frac = limit - Math.floor(limit);
          if (frac > 0.01) drawSegment(pts[i], pts[i+1], pathObj, frac);
        }
      }
    }

    function drawSegment(p1, p2, pathObj, fraction) {
      let shapeType = pathObj.shape;
      let sw = pathObj.weight;
      let col = pathObj.color;

      let x1 = p1.x * cellSize + cellSize / 2;
      let y1 = p1.y * cellSize + cellSize / 2;
      let x2 = p2.x * cellSize + cellSize / 2;
      let y2 = p2.y * cellSize + cellSize / 2;

      let d = dist(x1, y1, x2, y2);
      let angle = atan2(y2 - y1, x2 - x1);

      push();
      translate(x1, y1);
      rotate(angle); 
      
      let amp = 6 + sw; 
      let maxDrawD = d * fraction; 

      if (shapeType === 'dots') {
        fill(col);
        noStroke();
        for (let x = 0; x <= maxDrawD; x += sw * 2.5 + 4) circle(x, 0, sw * 1.5);
      } 
      else if (shapeType.startsWith('custom')) {
        let pts = customShapesData[shapeType];
        if (pts) {
          stroke(col); strokeWeight(sw); strokeJoin(ROUND); strokeCap(ROUND); noFill();
          let period = 40;
          for (let startX = 0; startX < maxDrawD; startX += period) {
            beginShape();
            for (let i = 0; i < pts.length; i++) {
              let drawX = startX + pts[i].nx * period;
              let drawY = pts[i].ny * amp * 1.5; 
              if (drawX <= maxDrawD + period*0.1) vertex(drawX, drawY);
            }
            endShape();
          }
        }
      }
      else {
        stroke(col); strokeWeight(sw); strokeJoin(ROUND); strokeCap(ROUND); noFill();
        beginShape();
        if (shapeType === 'line') {
          vertex(0, 0); vertex(maxDrawD, 0);
        } 
        else if (shapeType === 'sine') {
          for (let x = 0; x <= maxDrawD; x += 3) vertex(x, sin(map(x, 0, d, 0, TWO_PI * 2)) * amp);
        } 
        else if (shapeType === 'saw') {
          let period = 15;
          for (let x = 0; x <= maxDrawD; x += period) {
            if (x <= maxDrawD) vertex(x, 0); 
            if (x + period/2 <= maxDrawD) { vertex(x + period/2, -amp); vertex(x + period/2, amp); }
          }
          if (maxDrawD > d - 2) vertex(d, 0);
        } 
        else if (shapeType === 'square') {
          let period = 20;
          for (let x = 0; x <= maxDrawD; x += period) {
            if (x <= maxDrawD) { vertex(x, 0); vertex(x, -amp); }
            if (min(x + period/2, d) <= maxDrawD) { vertex(min(x + period/2, d), -amp); vertex(min(x + period/2, d), amp); }
            if (min(x + period, d) <= maxDrawD) { vertex(min(x + period, d), amp); vertex(min(x + period, d), 0); }
          }
        }
        else if (shapeType === 'scribble') {
          for (let x = 0; x <= maxDrawD; x += 6) vertex(x + random(-sw, sw), random(-amp, amp));
        }
        else if (shapeType === 'water') {
          for (let x = 0; x <= maxDrawD; x += 4) {
            let globalX = (x1 + x * cos(angle)) * 0.02;
            let globalY = (y1 + x * sin(angle)) * 0.02;
            let y = map(noise(globalX, globalY), 0, 1, -amp*2, amp*2);
            vertex(x, y);
          }
        }
        else if (shapeType === 'dither') {
          for (let x = 0; x <= maxDrawD; x += sw + 3) {
            let h = random(amp * 0.5, amp * 1.5);
            vertex(x, -h); vertex(x, h);
          }
        }
        else if (shapeType === 'crazy') {
          for (let x = 0; x <= maxDrawD; x += 10) vertex(x, random(-amp * 5, amp * 5));
        }
        else if (shapeType === 'dash') {
          endShape();
          for (let x = 0; x < maxDrawD; x += sw * 4) line(x, 0, min(x + sw * 2, maxDrawD), 0);
          beginShape(); 
        }
        else if (shapeType === 'coil') {
          for (let t = 0; t <= maxDrawD; t += 2) vertex(t + cos(t * 0.4) * amp, sin(t * 0.4) * amp);
        }
        else if (shapeType === 'ecg') {
          for (let x = 0; x <= maxDrawD; x += 2) {
            let y = 0;
            let cycle = x % 50; 
            if (cycle > 20 && cycle < 25) y = -amp * 2.5; 
            else if (cycle >= 25 && cycle < 30) y = amp * 2;
            else if (cycle >= 30 && cycle < 33) y = -amp * 0.5;
            vertex(x, y);
          }
        }
        else if (shapeType === 'bounce') {
          for (let x = 0; x <= maxDrawD; x += 2) {
            vertex(x, -Math.abs(sin(x * 0.1)) * amp * 2);
          }
        }
        endShape();
      }
      pop();
    }
  </script>
